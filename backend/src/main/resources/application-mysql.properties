# ==============================================================================
# RESQ DISPATCH: MYSQL PRODUCTION/DEMO CONFIGURATION (PROFILE: mysql)
# To activate: pass --spring.profiles.active=mysql
# ==============================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/resq_dispatch_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false
